<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Website</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
      }
      form {
        margin: 20px auto;
        padding: 10px;
        width: 300px;
        background: white;
        border-radius: 5px;
      }
      .res ul {
        list-style: none;
        padding: 0;
      }
      .res li {
        padding: 5px 0;
      }
    </style>
  </head>
  <body>
    <center>
      <h1>Bookmark Website</h1>
      <hr />
      <br />
    </center>

    <form>
      <label for="webTitle">Website Title:</label>
      <input type="text" id="webTitle" required />
      <br />
      <label for="webUrl">Website URL:</label>
      <input type="text" id="webUrl" required />
      <br />
      <button type="submit">Add</button>
    </form>

    <h2>All Bookmarks</h2>
    <div class="res"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.9.0/axios.min.js"></script>
    <script>
      const form = document.querySelector("form");
      const div = document.querySelector(".res");

      // Load bookmarks on page load
      window.addEventListener("load", () => {
        axios
          .get("https://crudcrud.com/api/9697da6eda7e4111abb664ce6667acc5/newtodo")
          .then((res) => {
            res.data.forEach((item) => {
              displayBookmark(item.title, item.url, item._id);
            });
          })
          .catch((err) => console.error(err));
      });

      // Add a new bookmark
      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const title = event.target.webTitle.value;
        const url = event.target.webUrl.value;

        if (title && url) {
          const data = { title, url };

          axios
            .post(
              "https://crudcrud.com/api/9697da6eda7e4111abb664ce6667acc5/newtodo",
              data
            )
            .then((response) => {
              displayBookmark(response.data.title, response.data.url, response.data._id);
              form.reset();
            })
            .catch((error) => console.error(error));
        }
      });

      // Function to display a bookmark
      function displayBookmark(title, url, id) {
        const ul = div.querySelector("ul") || document.createElement("ul");
        if (!div.contains(ul)) div.appendChild(ul);

        

        const li = document.createElement("li");
        li.innerText = `${title} > ${url}`;

        // Delete button
        const deleteBtn = document.createElement("button");
        deleteBtn.innerText = "Delete";
        deleteBtn.addEventListener("click", () => {
          axios
            .delete(
              `https://crudcrud.com/api/9697da6eda7e4111abb664ce6667acc5/newtodo/${id}`
            )
            .then(() => li.remove())
            .catch((error) => console.error(error));
        });

        // Edit button
        const editBtn = document.createElement("button");
        editBtn.innerText = "Edit";
        editBtn.addEventListener("click", () => {
          const newTitle = prompt("Edit Title", title);
          const newUrl = prompt("Edit URL", url);

          if (newTitle && newUrl) {
            const updatedData = { title: newTitle, url: newUrl };
            axios
              .put(
                `https://crudcrud.com/api/9697da6eda7e4111abb664ce6667acc5/newtodo/${id}`,
                updatedData
              )
              .then(() => {
                li.innerText = `${newTitle} > ${newUrl}`;
                li.appendChild(deleteBtn);
                li.appendChild(editBtn);
              })
              .catch((error) => console.error(error));
          }
        });

        li.appendChild(deleteBtn);
        li.appendChild(editBtn);
        ul.appendChild(li);
      }
    </script>
  </body>
</html>
